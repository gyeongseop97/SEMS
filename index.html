<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SEMS</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#172335;color:white;font-family:Arial,sans-serif}.box{padding:30px;border-radius:20px;background:rgba(255,255,255,.08)}h1{font-size:42px;margin:0 0 10px}</style></head><body><div class="box"><h1>SEMS</h1><p>기존 풀버전 시스템 복구 중입니다.</p><pre id="m"></pre></div><script>(async()=>{try{const u='https://'+'raw.githubusercontent.com'+'/gyeongseop97/SEMS/62a118c06e496c1cc87c37fde8d1fc6b7a065907/index.html';let h=await(await fetch(u,{cache:'no-store'})).text();h=h.replace('<button type="button" class="secondary mini-action" data-action="factors">적용 배출계수 세트 편집</button>','');h=h.replace('<div id="semsServerBadge" class="sems-server-badge">Supabase 연결됨</div>','');h=h.replace('</body>','<style>.dashboard-actions button[data-action="factors"],#semsServerBadge{display:none!important}body[data-sems-role="company_user"] #company,body[data-sems-role="company_user"] #filterCompany{background:#eef2f7!important;color:#334155!important;cursor:not-allowed!important}</style><script>(function(){function o(){return document.body?(document.body.dataset.semsCompany||""):""}function c(){return document.body&&document.body.dataset.semsRole==="company_user"}function l(){if(!c())return;const v=o();if(!v)return;["company","filterCompany"].forEach(id=>{const e=document.getElementById(id);if(e){if(Array.from(e.options).some(x=>x.value===v))e.value=v;e.disabled=true}});["chartCompanyFilter","summaryCompany","summarySite","chartSiteFilter"].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=false})}const ob=new MutationObserver(l);if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>{l();ob.observe(document.body,{childList:true,subtree:true,attributes:true})});else{l();ob.observe(document.body,{childList:true,subtree:true,attributes:true})}})();<\/script></body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('m').textContent=e.message}})();</script></body></html>
